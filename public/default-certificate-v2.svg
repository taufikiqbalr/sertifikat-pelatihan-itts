<svg width="1123" height="794" viewBox="0 0 1123 794" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="topAccent" x1="58" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F9FA8"/>
      <stop offset=".72" stop-color="#08747B"/>
      <stop offset="1" stop-color="#A71972"/>
    </linearGradient>
    <linearGradient id="softBand" x1="98" y1="634" x2="1027" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF8F7"/>
      <stop offset="1" stop-color="#FAF3F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#173A43" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1123" height="794" fill="#FCFDFD"/>
  <rect x="28" y="28" width="1067" height="738" rx="18" fill="#FFFFFF" stroke="#D9E5E7" stroke-width="2"/>
  <rect x="28" y="28" width="1067" height="12" rx="6" fill="url(#topAccent)"/>

  <!-- decorative corners -->
  <path d="M28 28H154L28 154V28Z" fill="#0F9FA8" fill-opacity=".09"/>
  <path d="M1095 28H1006L1095 117V28Z" fill="#A71972" fill-opacity=".10"/>
  <path d="M28 766V684L110 766H28Z" fill="#0F9FA8" fill-opacity=".07"/>
  <path d="M1095 766V663L992 766H1095Z" fill="#A71972" fill-opacity=".08"/>

  <!-- institutional header -->
  <circle cx="92" cy="83" r="22" fill="#E6F7F7"/>
  <path d="M83 82.5 89.5 89 102 75.5" stroke="#08747B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="78" fill="#0F5962" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">INSTITUT TEKNOLOGI TANGERANG SELATAN</text>
  <text x="126" y="100" fill="#7A8992" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.3">DIGITAL CERTIFICATE</text>

  <text x="561.5" y="151" text-anchor="middle" fill="#132238" font-family="Georgia, serif" font-size="52" font-weight="700" letter-spacing="2">SERTIFIKAT</text>
  <text x="561.5" y="180" text-anchor="middle" fill="#73838B" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4">PENGHARGAAN &amp; PARTISIPASI</text>

  <!-- certificate number safe zone -->
  <text x="561.5" y="202" text-anchor="middle" fill="#89979D" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">NOMOR SERTIFIKAT</text>
  <rect x="292" y="211" width="539" height="42" rx="12" fill="#F0F8F8" stroke="#D8ECEB"/>
  <line x1="168" y1="271" x2="955" y2="271" stroke="#DCE6E8" stroke-width="1.5"/>

  <!-- participant zone -->
  <text x="561.5" y="314" text-anchor="middle" fill="#718087" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">DIBERIKAN KEPADA</text>
  <line x1="284" y1="388" x2="839" y2="388" stroke="#0F9FA8" stroke-opacity=".38" stroke-width="1.5"/>

  <!-- event zone -->
  <text x="561.5" y="417" text-anchor="middle" fill="#7C898F" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.3">ATAS PARTISIPASI DALAM KEGIATAN</text>

  <!-- metadata guides -->
  <text x="561.5" y="531" text-anchor="middle" fill="#98A4A9" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">DISELENGGARAKAN PADA</text>
  <text x="561.5" y="576" text-anchor="middle" fill="#98A4A9" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">PENYELENGGARA</text>

  <!-- lower verification / signature band -->
  <rect x="76" y="617" width="971" height="113" rx="18" fill="url(#softBand)" stroke="#E4ECEE"/>
  <text x="274" y="662" text-anchor="start" fill="#6E7F85" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">VERIFIKASI DIGITAL</text>
  <text x="274" y="682" text-anchor="start" fill="#829197" font-family="Arial, sans-serif" font-size="8">Pindai QR untuk memeriksa keaslian sertifikat</text>

  <text x="808" y="640" text-anchor="middle" fill="#6E7F85" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">PENANDATANGAN</text>
  <line x1="686" y1="708" x2="930" y2="708" stroke="#AEBCC1" stroke-width="1.2"/>

  <text x="561.5" y="750" text-anchor="middle" fill="#A0AAB0" font-family="Arial, sans-serif" font-size="9">
    Dokumen digital ini diterbitkan melalui Sistem Sertifikat ITTS dan dapat diverifikasi melalui QR Code
  </text>
</svg>